# EdgeDash Daily Scheduled Cycle
# steering rules 49, 51

name: Run EdgeDash Cycle

on:
  schedule:
    # 06:00 IST (Indian Standard Time, UTC+5:30) is 00:30 UTC
    - cron: '30 0 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab

jobs:
  run-cycle:
    name: Execute Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 10 # rule 51: hard timeout

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Database Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # rule 51: idempotent setup, safe to repeat
          python -m edgedash.storage --migrate

      - name: Execute EdgeDash Cycle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Redirect output to cycle.log for artifact upload while still printing to console.
          # Use pipeline status checking to ensure the step fails if the python script exits with non-zero.
          set -o pipefail
          python run_cycle.py 2>&1 | tee cycle.log

      - name: Run Health Check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m edgedash.health

      - name: Upload Cycle Log
        if: always() # Upload log even if the cycle failed
        uses: actions/upload-artifact@v6
        with:
          name: cycle-log
          path: cycle.log
          retention-days: 7
